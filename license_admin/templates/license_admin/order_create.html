{% extends 'license_admin/layout.html' %}
{% block title %}Tạo license · License Admin{% endblock %}
{% block content %}
<header class="page-header"><div><div class="eyebrow">TẠO ĐƠN HÀNG</div><h1>Tạo license key mới</h1><p>Key được sinh ngay nhưng chỉ được kích hoạt sau khi thanh toán được xác nhận.</p></div></header>
<form method="post" class="card form-card" id="order-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
        <label>Gói dịch vụ<select name="plan_code" id="plan_code" required>{% for code, plan in plan_catalog.items() %}<option value="{{ code }}">{{ plan.name }} · {{ format_vnd_millions(plan.monthly_amount_vnd) }}/tháng · {{ payment_term_label(plan) }}</option>{% endfor %}</select></label>
        <label>Số thiết bị được phép<input type="number" name="max_devices" min="1" max="500" value="1" required></label>
        <label>Tên tổ chức<input name="organization_name" maxlength="150" required placeholder="Ví dụ: Bệnh viện Demo"></label>
        <label>Người liên hệ<input name="contact_name" maxlength="100" required placeholder="Ví dụ: Nguyễn Minh Anh"></label>
        <label>Email liên hệ<input type="email" name="contact_email" maxlength="150" placeholder="contact@example.com"></label>
        <label id="enterprise-amount" class="enterprise-only">Giá hợp đồng (VND)<input type="number" name="enterprise_amount_vnd" min="1" placeholder="Ví dụ: 300000000"></label>
        <label id="enterprise-days" class="enterprise-only">Thời hạn (ngày)<input type="number" name="enterprise_validity_days" min="1" max="1095" placeholder="Ví dụ: 365"></label>
        <label class="full">Ghi chú nội bộ<textarea name="notes" maxlength="1000" placeholder="Phạm vi triển khai, điều khoản hoặc ghi chú đối soát..."></textarea></label>
    </div>
    <div class="form-actions"><a class="button secondary" href="{{ url_for('license_portal.order_list') }}">Hủy</a><button class="button primary" type="submit">Tạo đơn hàng và key</button></div>
</form>
<script>
const planSelector = document.getElementById('plan_code');
const toggleEnterprise = () => document.querySelectorAll('.enterprise-only').forEach(el => el.classList.toggle('shown', planSelector.value === 'enterprise'));
planSelector.addEventListener('change', toggleEnterprise); toggleEnterprise();
</script>
{% endblock %}
